<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MarkNic</title>
    <link rel="stylesheet" href="style-index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>

    <div class="card-container">

        <div class="top-section">
            <header class="header">
                <img src="Logo Temp.png" alt="Logo MarkNic" class="logo">
                <h1 class="headline">¡Ahora es el momento de cambiar!</h1>
            </header>

            <form class="search-form" id="formBusqueda">
                <div class="input-group">
                    <i class="fa fa-briefcase input-icon"></i>
                    <input type="text" id="cargo" placeholder="Cargo o área" required>
                </div>
                <div class="input-group">
                    <i class="fa fa-map-marker-alt input-icon"></i>
                    <input type="text" id="lugar" placeholder="Lugar" required>
                </div>
                <button type="submit" class="search-button" id="btnBuscar">
                    <i class="fa fa-search"></i> Buscar empleos
                </button>
            </form>

            <div class="curve-divider">
                <svg viewBox="0 0 1440 320" preserveAspectRatio="none">
                    <path fill="#ffffff" fill-opacity="1" d="M0,192L48,208C96,224,192,256,288,256C384,256,480,224,576,224C672,224,768,256,864,256C960,256,1056,224,1152,202.7C1248,181,1344,171,1392,165.3L1440,160L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path>
                </svg>
            </div>
        </div>

        <div class="bottom-section">
            <div class="stat-group">
                <span class="stat-value">Tu próximo empleo comienza aquí</span>
                <br> </br>
                <button type="button" class="start-button" id="btnIniciarSesion"> Iniciar Sesión </button>
            </div>

            <div class="stat-group">
                <button type="button" class="start-button" id="btnRegistrar"> Registrarse </button>
            </div>
        </div>

        <div class="country-section">
            <p class="country-text" id="mensajeInfo">Crea una cuenta o inicia sesión para ver recomendaciones de empleo personalizadas.</p>
        </div>

        <footer>
            <div class="Copyright">
                <small> &copy; 2026 MarkNic</small>
            </div>
        </footer>

    </div>

    <script src="Script.js"></script>
</body>
</html>
