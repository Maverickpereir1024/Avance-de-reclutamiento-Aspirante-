<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reclutamiento</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">Mark<span>Nic</span></div>
        <button class="btn-cv-icon"><i class="fas fa-user"></i></button>
    </nav>

    <div class="container">
        <section class="search-section">
            <div class="search-box">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Cargo o categoría">
            </div>

            <div class="mobile-filters">
                <button class="filter-chip active">Pasantia</button>
                <button class="filter-chip">Experiencia <i class = "fas fa-chevron-down"></i></button>
                <button class="filter-chip">Salario <i class="fas fa-chevron-down"></i></button>
                <button class="filter-chip">Ubicación <i class="fas fa-chevron-down"></i></button>
                <button class="filter-chip">Jornada <i class="fas fa-chevron-down"></i></button>
            </div>

        </section>
        <div class="alert-banner">
            <p><i class="fas fa-bell"></i> ¿Quieres recibir ofertas de Trabajo?</p>
            <button>Activar</button>
        </div>

        <class="jobs-feed">
            <h3 class="section-title">3 Ofertas encontradas</h3>
            
            <div class="job-card">
                <div class="card-header">
                    <h4>Ejecutivo de Soporte Tecnico</h4>
                    <i class="fas fa-ellipsis-v"></i>
                </div>

                <p class="company"><i class="fas fa-check-circle"></i> Maverick, S.A.</p>
                <p class="location"><i class="fas fa-map-marker-alt"></i> Managua, Nicaragua</p>
                
                <div class="card-footer">
                    <span class="tag">Hace 9 días</span>
                    <button class="btn-details">Ver detalle</button>
                </div>
            </div>

            <div class="job-card">
                <div class="card-header">
                    <h4>Pasante de Sistemas</h4>
                    <i class="fas fa-ellipsis-v"></i>
                </div>

                <p class="company"><i class="fas fa-check-circle"></i> Castillo Solutions</p>
                <p class="location"><i class="fas fa-laptop-house"></i> Trabajo Remoto</p>
                
                <div class="card-footer">
                    <span class="tag">Nuevo</span>
                    <button class="btn-details">Ver detalle</button>
                </div>
            </div>
            
             <div class="job-card">
                <div class="card-header">
                    <h4>Analista de Datos Jr.</h4>
                    <i class="fas fa-ellipsis-v"></i>
                </div>

                <p class="company"><i class="fas fa-check-circle"></i> Kenneth Lopez Corporation</p>
                <p class="location"><i class="fas fa-map-marker-alt"></i> Chinandega, Nicaragua</p>
                <div class="card-footer">
                 <span class="tag">Hace 2 días</span>
                <button class="btn-details1">Ver detalle</button>
            </div>
        </div>
        </section>
    </div>
</body>

</html>
